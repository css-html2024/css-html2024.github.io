<!DOCTYPE html>
<html>
	<head>
		<title>Mangrove &lt; css-html24</title>
		<meta charset="UTF-8">
		<meta name="description" content="Website dedicated to css-html2024 & SpreadingIllogical">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<style>
			@import url('https://fonts.googleapis.com/css2?family=Abel&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
			@import url("https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css");	
		</style>
		<style>
		  	body {
				margin: 0;
				overflow-x: hidden;
				background: #757461;
				color: white;
				font-family: "Roboto", sans-serif;
			}
			
			header {
				position: relative;
				height: 100dvh;
				min-height: 80dvh;
				width: 100%;
				overflow: hidden;
			}

			.header_filter {
				position: absolute;
				inset: 0;
				background-image: url("https://r4.wallpaperflare.com/wallpaper/659/153/296/anime-girls-anime-kasane-teto-guitar-cherry-blossom-hd-wallpaper-559779d8705477fe805efc321aeb8045.jpg");
				background-size: cover;
				background-position: center;
				background-attachment: fixed;
				filter: blur(3px) brightness(70%);
				z-index: 0;
			}

			.MOTD_Card {
				position: absolute;
				z-index: 1;
				top: 50%;
				left: 50%;
				transform: translate(-50%, -50%);
				box-sizing: border-box;

				width: 400px;
				
				padding: 16px;

				border-radius: 8px;
				background-color: #fff;
			}
			.MOTD_Content {
				display: block;

				font-family: "Abel", sans-serif;
				font-size: 200%;
				color: black;
			}
			.MOTD_Attribute {
				display: block;

				text-align: right;
				text-decoration: none;
				color: gray;
			}
			.MOTD_Attribute::before {content: "--"}

			#social_medias {
				display: block;
				box-sizing: border-box;

				padding: 8px;
				margin: auto;

				width: fit-content;

				background-color: antiquewhite;

				border-radius: 16px;
			}
			#social_medias > a {
				font-size: 300%;
				color: rgb(85, 85, 85);
				text-decoration: none;
			}

			.Intro {
				text-align: center;
			}
			.Projects {
				text-align: center;
			}
		</style>
	</head>
	<body>
		<header>
		    <div class=header_filter></div>
			<div class="MOTD_Card">
				<span class="MOTD_Content">...I can see in the dark, you know! The question is... Can you?</span>
				<a class="MOTD_Attribute" href="https://deltarune.wiki/w/Shadow_Mantle_holder#:~:text=I%20can,you,-%3F">Shadow Mantle Holder</a>
			</div>
		</header>
		<div class="Intro">
			<h1 class="Intro Headline">This is SpreadingIllogical's page</h1>
			<!-- <a href="#" class="Intro GotoAboutMe">#AboutMe</a> -->
			<div id="social_medias">
				<a href="https://github.com/css-html2024">
					<i class="bi bi-github"></i>
				</a>
				<a href="https://youtube.com/@SpreadingIllogical">
					<i class="bi bi-youtube"></i>
				</a>
			</div>
		</div>
		<div class="Projects">
			<h2 class="Projects Headline">Cool projects you should check out!!</h2>
			<span style="font-style: italic; color:#c8c6a7">Stay tuned!</span>
		</div>
	</body>
</html>
